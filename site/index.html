<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>KURO</title>
<style>
/* ------------------------------------------------------------------
   tokens
   ------------------------------------------------------------------ */
:root{
  --canvas:#101010;
  --canvas-soft:#171717;
  --raise:#202020;
  --ink:#f2f2f2;
  --body:#bdbdbd;
  --mute:#8b8b93;
  --acid:#C8E634;
  /* origin palette, favicon and OG image only */
  --origin-ink:#0B0B0C;
  --origin-paper:#F5F2EF;

  --font-text:Inter,"KuroFallback",Arial,"Helvetica Neue",sans-serif;

  --text-display:clamp(2.5rem,1.25rem + 5.2vw,5.5rem);
  --text-h2:clamp(2rem,1.4rem + 2.6vw,3.25rem);
  --text-h3:clamp(1.25rem,1.1rem + 0.6vw,1.625rem);
  --text-fact:clamp(1.5rem,1.2rem + 1.2vw,2rem);
  --text-lead:1.125rem;
  --text-body:1rem;
  --text-meta:0.875rem;
  --text-rail:0.9375rem;

  --track-display:-0.045em;
  --track-head:-0.03em;
  --track-row:-0.015em;
  --track-fact:-0.02em;

  /* 4px spacing scale */
  --s-1:4px;
  --s-2:8px;
  --s-3:12px;
  --s-4:16px;
  --s-5:20px;
  --s-6:24px;
  --s-8:32px;
  --s-10:40px;
  --s-12:48px;
  --s-16:64px;
  --s-20:80px;
  --s-24:96px;
  --s-32:128px;

  --r-1:6px;
  --r-2:8px;

  --fast:140ms;
  --base:220ms;
  --ease:cubic-bezier(0.22,1,0.36,1);

  --gutter:clamp(20px,4vw,56px);
  --width:1240px;
  --measure:68ch;
  --bar-h:64px;
  color-scheme:dark;
}

/* ------------------------------------------------------------------
   faces: Inter variable, wght 400-700 only, self-hosted
   KuroFallback is Arial with Inter's metrics, so the swap does not shift
   the layout. Its family name is arbitrary, which keeps the lint's one
   accepted Inter warning to a single line.
   ------------------------------------------------------------------ */
@font-face{
  font-family:"Inter";
  src:url("assets/fonts/inter-var-latin.woff2") format("woff2");
  font-weight:400 700;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KuroFallback";
  src:local("Arial"),local("Helvetica Neue"),local("Liberation Sans");
  size-adjust:107%;
  ascent-override:90%;
  descent-override:22.5%;
  line-gap-override:0%;
}

/* ------------------------------------------------------------------
   base
   ------------------------------------------------------------------ */
*,*::before,*::after{box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
  scroll-padding-top:var(--bar-h);
}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:var(--canvas);
  color:var(--body);
  font-family:var(--font-text);
  font-size:var(--text-body);
  line-height:1.65;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

main{flex:1 0 auto}

h1,h2,h3{
  margin:0;
  color:var(--ink);
  font-weight:600;
  text-wrap:balance;
}
h1{font-size:var(--text-display);line-height:0.98;letter-spacing:var(--track-display)}
h2{font-size:var(--text-h2);line-height:1.05;letter-spacing:var(--track-head)}
h3{font-size:var(--text-h3);line-height:1.2;letter-spacing:var(--track-row)}

p{margin:0}

a{color:inherit;text-decoration:none}

img,svg{display:block;max-width:100%}

::selection{background:var(--acid);color:var(--canvas)}

/* type roles that are not tied to a heading level */
.t-fact{
  font-size:var(--text-fact);
  line-height:1.1;
  font-weight:700;
  letter-spacing:var(--track-fact);
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.t-lead{
  font-size:var(--text-lead);
  line-height:1.6;
  color:var(--body);
  max-width:var(--measure);
}
.t-meta{
  font-size:var(--text-meta);
  line-height:1.4;
  font-weight:500;
  color:var(--mute);
}

/* focus ring sits on the canvas at 13.4:1, never removed */
:focus-visible{
  outline:2px solid var(--acid);
  outline-offset:3px;
  border-radius:var(--r-1);
}

/* screen-reader only */
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

.skip{
  position:absolute;
  top:var(--s-3);
  left:var(--s-3);
  z-index:30;
  padding:var(--s-3) var(--s-5);
  border-radius:var(--r-2);
  background:var(--acid);
  color:var(--canvas);
  font-weight:600;
  transform:translateY(-200%);
  transition:transform var(--fast) var(--ease);
}
.skip:focus{transform:none}

/* layout */
.wrap{
  width:100%;
  max-width:var(--width);
  margin-inline:auto;
  padding-inline:var(--gutter);
}

/* landmarks */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--canvas);
}
.foot{
  padding-block:var(--s-8);
  color:var(--mute);
  font-size:var(--text-meta);
}
.rail{
  display:block;
}

@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:0ms !important;
    animation-duration:0ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to services</a>

<header class="topbar">
  <div class="wrap"></div>
</header>

<main id="main">
  <nav class="rail" aria-label="Sections"></nav>
</main>

<footer class="foot">
  <div class="wrap"></div>
</footer>
</body>
</html>
